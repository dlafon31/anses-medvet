<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualisation base ANSES</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bleu: #000091; --bleu-clair: #e3e3fd; --texte: #161616; --gris: #666; --bord: #ddd;
    --fond: #fff; --fond-2: #f6f6f6; --ok: #18753c; --warn: #b34000; --err: #ce0500;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Marianne, Arial, sans-serif; color: var(--texte); background: var(--fond); }
  main { padding: 16px; max-width: 980px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--gris); margin: 0 0 16px; }
  .card { border: 1px solid var(--bord); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; background: var(--fond); }
  .grid { display: grid; grid-template-columns: 180px 1fr; gap: 6px 12px; align-items: center; }
  .grid label, .k { color: var(--gris); }
  input[type=url] { width: 100%; padding: 6px 8px; border: 1px solid var(--bord); border-radius: 4px; font: inherit; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, .btn { font: inherit; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--bleu); background: var(--fond); color: var(--bleu); cursor: pointer; }
  button.primary { background: var(--bleu); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn input { display: none; }
  .progress { height: 6px; background: var(--fond-2); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
  .progress > div { height: 100%; width: 0; background: var(--bleu); transition: width .2s; }
  #phase { color: var(--gris); min-height: 1.4em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--bord); vertical-align: top; }
  th { background: var(--fond-2); font-weight: 600; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 12px; background: var(--fond-2); }
  .tag.ok { background: #b8fec9; color: var(--ok); } .tag.err { background: #ffe9e9; color: var(--err); } .tag.chg { background: var(--bleu-clair); color: var(--bleu); }
  #log { max-height: 260px; overflow: auto; background: var(--fond-2); border-radius: 4px; padding: 8px 10px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; margin: 0; }
  .warn { color: var(--warn); } .error { color: var(--err); } .okc { color: var(--ok); }
  .hidden { display: none; }
  .banner { padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; }
  .banner.info { background: var(--bleu-clair); } .banner.error { background: #ffe9e9; color: var(--err); }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Actualisation de la base des médicaments vétérinaires</h1>
  <p class="sub">Télécharge le fichier Excel de l'ANSES et met à jour chaque table associée à un onglet (correspondances de la table Admin, sinon même nom).</p>

  <div id="banner" class="banner hidden"></div>

  <section class="card grid">
    <label for="url">Fichier source</label>
    <input id="url" type="url" spellcheck="false">
    <span class="k">Version publiée</span><span id="remote">…</span>
    <span class="k">Export dans le document</span><span id="local">…</span>
  </section>

  <section class="card">
    <div class="actions">
      <button id="btnAnalyse" class="primary">1. Télécharger et analyser</button>
      <button id="btnApply" disabled>2. Appliquer les modifications</button>
      <label class="btn">Importer un fichier Excel…<input id="file" type="file" accept=".xlsx,.xls"></label>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div id="phase"></div>
  </section>

  <section id="resultCard" class="card hidden">
    <table>
      <thead><tr><th>Table</th><th>Mode</th><th class="n">Lignes Excel</th><th class="n">Ajouts</th><th class="n">Modifs</th><th class="n">Suppr.</th><th>Alertes</th></tr></thead>
      <tbody id="result"></tbody>
    </table>
  </section>

  <section class="card">
    <pre id="log"></pre>
  </section>
</main>

<script src="js/refresher.js"></script>
<script src="js/widget.js"></script>
</body>
</html>
